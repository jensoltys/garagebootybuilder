name: Bug report
description: Something in Garage Booty Builder doesn't work the way it should
labels: [bug]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - The try-it page (jensoltys.github.io)
        - My own copy
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen
      placeholder: "1. Open ...\n2. Tap ...\n3. See ..."
  - type: input
    id: browser
    attributes:
      label: Browser and device
